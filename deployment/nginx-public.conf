map $http_authorization $quanttrade_api_authorization {
    default "";
    "~^Bearer " $http_authorization;
}
server {
    listen 80;
    listen [::]:80;
    server_name quanttrade.azurestore.shop;
    location ^~ /.well-known/acme-challenge/ { root /var/www/quanttrade-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name quanttrade.azurestore.shop;
    ssl_certificate /etc/letsencrypt/live/quanttrade.azurestore.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quanttrade.azurestore.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Stream loopback responses without relying on host proxy-temp permissions.
    proxy_buffering off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Standalone QuantTrade does not ship Pairlens' private App Server.
    # Background news/auth polling must fail without a browser Basic challenge.
    # The standalone bridge supplies the public news and schedule contracts.
    location ~ ^/api/(news|earnings-calendar|ipo-calendar|economic-calendar|liquidations)$ {
        proxy_pass http://127.0.0.1:4318;
        proxy_set_header Host 127.0.0.1:4318;
        proxy_set_header Authorization "";
        proxy_read_timeout 90s;
        proxy_connect_timeout 3s;
    }
    location /api/ {
        default_type application/json;
        return 503 '{"error":"The optional cloud service is unavailable in this deployment"}';
    }
    # Public build metadata contains no account information. The updater polls
    # it independently of the terminal's protected navigation.
    location = /version.json {
        root /opt/quanttrade/current/frontend;
        try_files /version.json =404;
        add_header Cache-Control "no-store";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location = /login {
        types { }
        default_type text/html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        alias /opt/quanttrade/current/deployment/login.html;
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    }
    location = /login-assets/quanttrade-wordmark.svg {
        alias /opt/quanttrade/current/frontend/quanttrade-wordmark.svg;
        default_type image/svg+xml;
    }
    location = /login-assets/quanttrade-mark.svg {
        alias /opt/quanttrade/current/frontend/quanttrade-mark.svg;
        default_type image/svg+xml;
    }
    location = /login-assets/hanken-grotesk-latin.woff2 {
        alias /opt/quanttrade/current/frontend/assets/hanken-grotesk-latin-wght-normal-CaVRRdDk.woff2;
        default_type font/woff2;
    }
    location = /login.js { alias /opt/quanttrade/current/deployment/login.js; }
    location = /login.css { alias /opt/quanttrade/current/deployment/login.css; }
    location = /_session_check {
        internal;
        proxy_pass http://127.0.0.1:4318/api/session-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host 127.0.0.1:4318;
        proxy_set_header Authorization "";
        proxy_set_header X-QuantTrade-Session-Secret "";
    }
    location = /_quanttrade/api/sync-state {
        proxy_pass http://127.0.0.1:4318/api/sync-state;
        proxy_set_header Host 127.0.0.1:4318;
        proxy_set_header Authorization $quanttrade_api_authorization;
        proxy_set_header X-QuantTrade-Session-Secret "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 3s;
        client_max_body_size 512k;
    }
    location ^~ /_quanttrade/ {
        proxy_pass http://127.0.0.1:4318/;
        proxy_set_header Host 127.0.0.1:4318;
        proxy_set_header Authorization $quanttrade_api_authorization;
        proxy_set_header X-QuantTrade-Session-Secret "";
        proxy_read_timeout 300s;
        proxy_connect_timeout 3s;
        client_max_body_size 32k;
    }
    location @sign_in { return 302 /login?next=$request_uri; }
    location / {
        auth_request /_session_check;
        error_page 401 = @sign_in;
        proxy_pass http://127.0.0.1:4317;
        proxy_set_header Host localhost;
        proxy_set_header Authorization "";
        proxy_read_timeout 75s;
    }
}
